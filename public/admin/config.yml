backend:
  name: git-gateway
  branch: main # Branch to update (master or main)
local_backend: true
  name: git-gateway
  branch: main # Branch to update (master or main)

# Hide the default Decap CMS logo
logo_url: /logo.png

media_folder: "public/img"
public_folder: "/img"

collections:
  - name: "menu"
    label: "Menu Data"
    editor:
      preview: false
    files:
      - label: "Main Menu"
        name: "main-menu"
        file: "content/menu.json"
        fields:
          - label: "Menu Sections"
            name: "menuSections"
            widget: "list"
            fields:
              - label: "ID"
                name: "id"
                widget: "string"
              - label: "Title"
                name: "title"
                widget: "string"
              - label: "Subtitle"
                name: "subtitle"
                widget: "string"
                required: false
              - label: "Preheader"
                name: "preheader"
                widget: "string"
                required: false
              - label: "Items"
                name: "items"
                widget: "list"
                fields:
                  - label: "Name"
                    name: "name"
                    widget: "string"
                  - label: "Price"
                    name: "price"
                    widget: "string"
                    required: false
                  - label: "Description"
                    name: "description"
                    widget: "text"
                    required: false
                  - label: "Most Ordered?"
                    name: "isMostOrdered"
                    widget: "boolean"
                    required: false
                    default: false
                  - label: "Signature?"
                    name: "isSignature"
                    widget: "boolean"
                    required: false
                    default: false
                  - label: "Monsoon?"
                    name: "isMonsoon"
                    widget: "boolean"
                    required: false
                    default: false
                  - label: "Custom Tag"
                    name: "customTag"
                    widget: "string"
                    required: false
                  - label: "Force Square on Mobile?"
                    name: "_isSquareMobile"
                    widget: "boolean"
                    required: false
                    default: false
                  - label: "Force Rectangular?"
                    name: "_isForcedRectangular"
                    widget: "boolean"
                    required: false
                    default: false

  - name: "settings"
    label: "Site Settings"
    editor:
      preview: false
    files:
      - label: "General Settings"
        name: "general-settings"
        file: "content/settings.json"
        fields:
          - label: "Hero Video"
            name: "heroVideo"
            widget: "file"
            hint: "WARNING: The video should be 2-5 MB and only change 2-3 times."
