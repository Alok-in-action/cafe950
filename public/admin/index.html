<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager</title>
  <style>
    /* Mobile optimization for Decap CMS */
    @media (max-width: 768px) {
      /* Make the main layout stack vertically instead of side-by-side */
      div[class*="AppMainContainer"] {
        flex-direction: column !important;
      }
      /* Make sidebar full width */
      div[class*="SidebarContainer"] {
        min-width: 100% !important;
        width: 100% !important;
        margin-bottom: 20px;
        padding: 10px !important;
      }
      /* Make main content area full width */
      div[class*="CollectionContainer"], div[class*="EditorContainer"] {
        min-width: 100% !important;
        width: 100% !important;
        padding: 10px !important;
      }
      /* Make cards full width */
      div[class*="CardContainer"] {
        width: 100% !important;
        margin: 0 0 15px 0 !important;
      }
      /* Wrap toolbar items */
      div[class*="ToolbarContainer"] {
        flex-wrap: wrap !important;
        height: auto !important;
        padding: 10px !important;
      }
      /* Fix list widget overflow */
      div[class*="ListControl"] {
        overflow-x: hidden !important;
      }
      /* Make inputs take full width */
      input, textarea, select {
        max-width: 100% !important;
      }
    }
  </style>
  <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url">
  <!-- Netlify Identity Widget -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <!-- Include the script that builds the page and powers Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.1.2/dist/decap-cms.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
